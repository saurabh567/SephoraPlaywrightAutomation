# JMeter Configuration for Amazon India Performance Tests
# =======================================================
# This file defines defaults used by runJMeter.js
#
# Fast Demo Mode: USERS=1, RAMP_UP=1, DURATION=10, LOOP_COUNT=1
# Max execution time ≈ 60 seconds for demonstrations.
# Override via environment variables: JMETER_USERS, JMETER_RAMPUP, JMETER_DURATION

# --- Test Plan Settings ---
jmeter.test.plan=performance/jmeter/plans/amazon-load-test.jmx
jmeter.test.name=amazon-load-test

# --- Load Profile (Fast Demo Mode defaults) ---
jmeter.users=1
jmeter.rampup=1
jmeter.duration=10
jmeter.loop=1

# --- Target ---
jmeter.base.url=https://www.amazon.in
jmeter.search.term=laptop

# --- Output Paths ---
jmeter.jtl.dir=reports/jmeter/jtl
jmeter.html.dir=reports/jmeter/html
jmeter.summary.dir=reports/jmeter/summary

# --- Thresholds (build fails if exceeded) ---
jmeter.threshold.error.pct=5
jmeter.threshold.avg.response.time=5000
jmeter.threshold.pct.response.time=8000
jmeter.threshold.pct.response.time.label=90

# --- JMeter Binary ---
# Leave empty to auto-detect from PATH or JMETER_HOME
jmeter.binary=

# --- JVM Args ---
jmeter.heap=-Xms1g -Xmx2g
jmeter.locale=-Duser.language=en -Duser.region=IN
